name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  security-policy:
    name: Dependency Review policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      dependency_review_enabled: ${{ steps.security-policy.outputs.dependency_review_enabled }}

    steps:
      - name: Check out trusted security policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check security capabilities
        id: security-policy
        env:
          GH_TOKEN: ${{ github.token }}
          DF_CODEQL_ENABLED: ${{ vars.DF_CODEQL_ENABLED }}
          DF_CODE_SCANNING_UPLOAD_ENABLED: ${{ vars.DF_CODE_SCANNING_UPLOAD_ENABLED }}
          DF_DEPENDENCY_REVIEW_ENABLED: ${{ vars.DF_DEPENDENCY_REVIEW_ENABLED }}
        run: node scripts/ci/generated/security-preflight.mjs workflow --workflow dependency-review

  dependency-review:
    name: Dependency Review
    needs: security-policy
    if: ${{ !cancelled() && (needs.security-policy.result != 'success' || needs.security-policy.outputs.dependency_review_enabled == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Fail when security policy did not succeed
        id: policy-failure
        if: ${{ !cancelled() && needs.security-policy.result != 'success' }}
        run: echo "Security policy did not succeed."; exit 1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
