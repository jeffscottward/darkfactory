name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Node 22.13.1 bundles Corepack without the signing key needed for pnpm 11.16.0.
      - name: Set up compatible Corepack
        run: |
          npm install --global corepack@0.34.7
          corepack enable
          corepack install --global pnpm@11.16.0

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Start trusted local HTTPS proxy
        run: corepack pnpm exec portless proxy start

      - name: Run canonical CI lifecycle
        run: corepack pnpm run ci

      - name: Preserve Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
