name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  verification:
    name: Verification (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [core, coverage, integration, browser]
    # Keep CI infrastructure unprivileged and isolated from production credentials.
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://darkfactory_test_runner:darkfactory-test-only@127.0.0.1:5432/darkfactory_test_maintenance

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        if: matrix.lane == 'browser'
        run: bunx --bun --no-install playwright install --with-deps chromium

      - name: Start PostgreSQL integration service
        if: matrix.lane == 'integration' || matrix.lane == 'browser'
        run: docker compose -f infra/docker/postgres.compose.yml up --detach --wait

      - name: Run verification lane
        run: bun run "verify:${{ matrix.lane }}"

      # Playwright owns the HTTPS proxy and app server; keep evidence of failures only.
      - name: Upload Playwright failure evidence
        if: matrix.lane == 'browser' && failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop PostgreSQL integration service
        if: (matrix.lane == 'integration' || matrix.lane == 'browser') && always()
        run: docker compose -f infra/docker/postgres.compose.yml down --volumes --remove-orphans
