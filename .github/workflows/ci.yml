name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  verification:
    name: Verification (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [core, coverage, integration, browser]
    # Keep CI infrastructure unprivileged and isolated from production credentials.
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://darkfactory_test_runner:darkfactory-test-only@127.0.0.1:5432/darkfactory_test_maintenance
      PORTLESS_PORT: "1355"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # Pin Corepack rather than trusting the copy bundled with Node so pnpm 11.16.0
      # signature verification never depends on the Node release's key snapshot.
      - name: Set up compatible Corepack
        run: |
          npm install --global corepack@0.34.7
          corepack enable
          corepack install --global pnpm@11.16.0

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright browser
        if: matrix.lane == 'browser'
        run: bunx --bun --no-install playwright install --with-deps chromium

      - name: Start PostgreSQL integration service
        if: matrix.lane == 'integration' || matrix.lane == 'browser'
        run: docker compose -f infra/docker/postgres.compose.yml up --detach --wait

      - name: Start local HTTPS proxy without system trust
        if: matrix.lane == 'browser'
        run: scripts/ci/portless-proxy.sh start

      - name: Verify local HTTPS proxy readiness
        if: matrix.lane == 'browser'
        run: scripts/ci/portless-proxy.sh ready

      # Chromium uses NSS, so trust the generated CA instead of bypassing HTTPS validation.
      - name: Trust portless CA in Chromium
        if: matrix.lane == 'browser'
        run: |
          set -euo pipefail
          if ! command -v certutil >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes libnss3-tools
          fi

          nss_db="$HOME/.pki/nssdb"
          ca_nickname="portless-local-ca"
          mkdir -p "$nss_db"
          if [ ! -f "$nss_db/cert9.db" ]; then
            certutil -N --empty-password -d "sql:$nss_db"
          fi
          if certutil -L -d "sql:$nss_db" -n "$ca_nickname" >/dev/null 2>&1; then
            certutil -D -d "sql:$nss_db" -n "$ca_nickname"
          fi
          certutil -A -d "sql:$nss_db" -n "$ca_nickname" -t "C,," -i "$NODE_EXTRA_CA_CERTS"
          certutil -L -d "sql:$nss_db" | grep -F -- "$ca_nickname"

      # The E2E runner runs the first PATH `pnpm` with the first PATH `node` and
      # rejects conflicting siblings. `corepack enable` puts its dispatcher shim
      # beside node, so expose Node and the signature-verified pnpm entry.
      - name: Pair Node with the Corepack pnpm entry for E2E
        if: matrix.lane == 'browser'
        run: |
          set -euo pipefail
          toolchain="$(mktemp -d "$RUNNER_TEMP/browser-toolchain.XXXXXX")"
          ln -s "$(realpath -e "$(command -v node)")" "$toolchain/node"
          ln -s "$(realpath -e "${COREPACK_HOME:-${XDG_CACHE_HOME:-$HOME/.cache}/node/corepack}/v1/pnpm/11.16.0/bin/pnpm.mjs")" "$toolchain/pnpm"
          test "$("$toolchain/node" "$toolchain/pnpm" --version)" = 11.16.0
          echo "$toolchain" >>"$GITHUB_PATH"

      - name: Build production browser server
        if: matrix.lane == 'browser'
        run: |
          set -euo pipefail
          bun run build
          printf '%s\n' '_DARKFACTORY_E2E_WEB_SCRIPT=start' >>"$GITHUB_ENV"

      - name: Run verification lane
        run: bun run "verify:${{ matrix.lane }}${{ matrix.lane == 'core' && ':ci' || '' }}"

      - name: Preserve externally scanned Playwright evidence
        if: matrix.lane == 'browser' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local HTTPS proxy
        if: matrix.lane == 'browser' && always()
        run: scripts/ci/portless-proxy.sh stop

      - name: Stop PostgreSQL integration service
        if: (matrix.lane == 'integration' || matrix.lane == 'browser') && always()
        run: docker compose -f infra/docker/postgres.compose.yml down --volumes --remove-orphans
