name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verification:
    name: Verification (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [core, coverage, integration, graph, browser]
    # Keep CI infrastructure unprivileged and isolated from production credentials.
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://darkfactory_test_runner:darkfactory-test-only@127.0.0.1:5432/darkfactory_test_maintenance
      PORTLESS_PORT: "1355"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Node 22.13.1 bundles Corepack without the signing key needed for pnpm 11.16.0.
      - name: Set up compatible Corepack
        run: |
          npm install --global corepack@0.34.7
          corepack enable
          corepack install --global pnpm@11.16.0

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Set up Python
        if: matrix.lane == 'graph'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: scripts/graph/requirements.lock

      - name: Install pinned Graphify
        if: matrix.lane == 'graph'
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes --requirement scripts/graph/requirements.lock
          graphify --version

      - name: Install Playwright browser
        if: matrix.lane == 'browser'
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Start PostgreSQL integration service
        if: matrix.lane == 'integration' || matrix.lane == 'browser'
        run: docker compose -f infra/docker/postgres.compose.yml up --detach --wait

      - name: Start trusted local HTTPS proxy
        if: matrix.lane == 'browser'
        run: corepack pnpm exec portless proxy start

      # Chromium uses NSS, so trust the generated CA instead of bypassing HTTPS validation.
      - name: Trust portless CA in Chromium
        if: matrix.lane == 'browser'
        run: |
          set -euo pipefail
          if ! command -v certutil >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes libnss3-tools
          fi

          nss_db="$HOME/.pki/nssdb"
          ca_nickname="portless-local-ca"
          mkdir -p "$nss_db"
          if [ ! -f "$nss_db/cert9.db" ]; then
            certutil -N --empty-password -d "sql:$nss_db"
          fi
          if certutil -L -d "sql:$nss_db" -n "$ca_nickname" >/dev/null 2>&1; then
            certutil -D -d "sql:$nss_db" -n "$ca_nickname"
          fi
          certutil -A -d "sql:$nss_db" -n "$ca_nickname" -t "C,," -i "$HOME/.portless/ca.pem"
          certutil -L -d "sql:$nss_db" | grep -F -- "$ca_nickname"

      - name: Build Graphify output and prove tracked metadata freshness
        if: matrix.lane == 'graph'
        run: |
          corepack pnpm run graph:build
          git diff --exit-code -- .graphify/manifest.json

      - name: Run verification lane
        run: corepack pnpm run "verify:${{ matrix.lane }}"

      - name: Preserve externally scanned Playwright evidence
        if: matrix.lane == 'browser' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop PostgreSQL integration service
        if: (matrix.lane == 'integration' || matrix.lane == 'browser') && always()
        run: docker compose -f infra/docker/postgres.compose.yml down --volumes --remove-orphans
