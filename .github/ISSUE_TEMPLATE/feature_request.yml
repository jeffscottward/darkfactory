name: Feature request
description: Propose a focused improvement to DarkFactory
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Describe the problem before the solution, and keep the request focused on one reviewable outcome.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Who is affected, what are they trying to do, and what limitation exists today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the observable outcome and its intended scope. Avoid prescribing unnecessary implementation details.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or simpler alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant examples, sketches, or links. Do not include secrets, personal data, or private system details.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this request.
          required: true
        - label: This request is limited to one coherent outcome.
          required: true
        - label: This request does not contain a suspected security vulnerability.
          required: true
